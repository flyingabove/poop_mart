<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PoopMart</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="description" content="One feed for the Pop Mart collector world — trending figures, prices, and Shake Guides." />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:         #121212;
    --surface:    #1a1a1a;
    --card:       #1f1f1f;
    --card-hover: #262626;
    --border:     #2b2b2b;
    --accent:     #ff5da2;
    --accent-dim: #7a2f52;
    --text:       #f2f2f2;
    --text-sub:   #a8a8a8;
    --text-muted: #6b6b6b;
    --good:       #35c56a;
    --bad:        #e5484d;
    --radius:     14px;
    --radius-sm:  8px;
    --font:       -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; }
  body { display: flex; flex-direction: column; }

  /* ---------------- Top bar ---------------- */
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .logo { font-weight: 800; font-size: 18px; letter-spacing: -0.02em; white-space: nowrap; }
  .logo span { color: var(--accent); }
  #search {
    flex: 1; background: var(--card); border: 1px solid var(--border); color: var(--text);
    border-radius: 999px; padding: 8px 14px; font-size: 14px; outline: none;
  }
  #search:focus { border-color: var(--accent); }
  #search-results {
    position: absolute; top: 54px; left: 16px; right: 16px; background: var(--card);
    border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; z-index: 20; display: none;
  }
  #search-results.open { display: block; }
  .search-hit { padding: 10px 14px; cursor: pointer; font-size: 14px; border-bottom: 1px solid var(--border); }
  .search-hit:last-child { border-bottom: none; }
  .search-hit:hover { background: var(--card-hover); }
  .search-hit small { color: var(--text-muted); margin-left: 6px; }

  /* ---------------- Tabs ---------------- */
  #tabs {
    display: flex; gap: 4px; overflow-x: auto; padding: 8px 12px; background: var(--surface);
    border-bottom: 1px solid var(--border); scrollbar-width: none;
  }
  #tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none; padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
    color: var(--text-sub); cursor: pointer; white-space: nowrap; border: 1px solid transparent;
  }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--accent-dim); color: #fff; border-color: var(--accent); }

  /* ---------------- Feed ---------------- */
  main { flex: 1; overflow-y: auto; padding: 14px; max-width: 640px; width: 100%; margin: 0 auto; }
  #feed { display: flex; flex-direction: column; gap: 10px; }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px; cursor: pointer; transition: background 0.12s;
  }
  .card:hover { background: var(--card-hover); }
  .card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .card-icon { font-size: 16px; }
  .card-type-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); font-weight: 700; }
  .card-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .card-body { font-size: 13.5px; color: var(--text-sub); line-height: 1.45; }
  .card-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; font-size: 11.5px; color: var(--text-muted); }
  .chip { background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px; }
  .chip.trust-official { color: var(--good); border-color: var(--good); }
  .chip.trust-unverified { color: var(--bad); border-color: var(--bad); }
  .badge-chip { color: var(--accent); border-color: var(--accent); font-weight: 700; }

  #empty { text-align: center; color: var(--text-muted); padding: 40px 0; font-size: 14px; }

  /* ---------------- Detail screen ---------------- */
  #detail { display: none; }
  #detail.open { display: block; }
  #feed-screen.hidden { display: none; }

  .back-btn {
    display: inline-flex; align-items: center; gap: 6px; color: var(--text-sub);
    cursor: pointer; font-size: 13px; margin-bottom: 14px;
  }
  .back-btn:hover { color: var(--text); }

  .detail-header h1 { font-size: 22px; margin-bottom: 4px; }
  .detail-header .sub { color: var(--text-sub); font-size: 13px; margin-bottom: 16px; }

  .price-box, .guide-box {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; margin-bottom: 16px;
  }
  .price-box h2, .guide-box h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-sub); margin-bottom: 10px; }
  .price-now { font-size: 28px; font-weight: 800; margin-bottom: 10px; }
  .price-now .delta.up { color: var(--good); font-size: 14px; margin-left: 8px; }
  .price-now .delta.down { color: var(--bad); font-size: 14px; margin-left: 8px; }
  svg.chart { width: 100%; height: 80px; display: block; }

  .etiquette { font-size: 12.5px; color: var(--text-muted); background: var(--surface); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 14px; }
  .signature { border-top: 1px solid var(--border); padding: 12px 0; }
  .signature:first-of-type { border-top: none; }
  .sig-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .sig-name { font-weight: 700; font-size: 14px; }
  .sig-conf { font-size: 12px; color: var(--text-muted); }
  .conf-bar { height: 5px; border-radius: 3px; background: var(--surface); overflow: hidden; margin-bottom: 6px; }
  .conf-bar-fill { height: 100%; background: var(--accent); }
  .sig-detail { font-size: 12.5px; color: var(--text-sub); }

  .contrib-form { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
  .contrib-form label { display: block; font-size: 12px; color: var(--text-sub); margin: 8px 0 4px; }
  .contrib-form select, .contrib-form input, .contrib-form textarea {
    width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text);
    border-radius: var(--radius-sm); padding: 8px 10px; font-size: 13px; font-family: var(--font);
  }
  .contrib-form button {
    margin-top: 12px; background: var(--accent); color: #1a0a12; border: none; font-weight: 700;
    padding: 9px 16px; border-radius: 999px; cursor: pointer; font-size: 13px;
  }
  .contrib-form button:hover { opacity: 0.9; }
  .form-note { font-size: 11.5px; color: var(--good); margin-top: 8px; display: none; }
  .form-note.show { display: block; }

  /* ---------------- Auth area / bell ---------------- */
  #auth-area { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
  #auth-area button {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  #auth-area button:hover { background: var(--card-hover); }
  #user-email { font-size: 12.5px; color: var(--text-sub); max-width: 130px; overflow: hidden; text-overflow: ellipsis; }

  #bell-wrap { position: relative; }
  #bell-btn { background: none !important; border: none !important; font-size: 18px; padding: 4px !important; position: relative; }
  #bell-badge {
    position: absolute; top: -2px; right: -2px; background: var(--accent); color: #1a0a12;
    font-size: 10px; font-weight: 800; border-radius: 999px; min-width: 15px; height: 15px;
    display: none; align-items: center; justify-content: center; padding: 0 3px;
  }
  #notif-dropdown {
    position: absolute; top: 38px; right: 0; width: 300px; max-height: 360px; overflow-y: auto;
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm);
    z-index: 30; display: none;
  }
  #notif-dropdown.open { display: block; }
  .notif-item { padding: 10px 12px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 13px; }
  .notif-item:last-child { border-bottom: none; }
  .notif-item:hover { background: var(--card-hover); }
  .notif-item.unread { background: rgba(255,93,162,0.08); }
  .notif-item .notif-title { font-weight: 700; margin-bottom: 2px; }
  .notif-item .notif-time { color: var(--text-muted); font-size: 11px; margin-top: 4px; }
  .notif-empty { padding: 16px; text-align: center; color: var(--text-muted); font-size: 13px; }

  /* ---------------- Auth modal ---------------- */
  #auth-modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 50; display: none;
    align-items: center; justify-content: center; padding: 20px;
  }
  #auth-modal-backdrop.open { display: flex; }
  #auth-modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; width: 100%; max-width: 340px; }
  #auth-modal h2 { font-size: 18px; margin-bottom: 4px; }
  #auth-modal .sub { color: var(--text-sub); font-size: 12.5px; margin-bottom: 16px; }
  #auth-modal label { display: block; font-size: 12px; color: var(--text-sub); margin: 10px 0 4px; }
  #auth-modal input {
    width: 100%; background: var(--card); border: 1px solid var(--border); color: var(--text);
    border-radius: var(--radius-sm); padding: 9px 12px; font-size: 14px; font-family: var(--font);
  }
  #auth-modal button[type="submit"] {
    width: 100%; margin-top: 16px; background: var(--accent); color: #1a0a12; border: none;
    font-weight: 700; padding: 10px; border-radius: 999px; cursor: pointer; font-size: 14px;
  }
  #auth-error { color: var(--bad); font-size: 12.5px; margin-top: 10px; display: none; }
  #auth-error.show { display: block; }
  #auth-toggle { text-align: center; margin-top: 14px; font-size: 12.5px; color: var(--text-sub); cursor: pointer; }
  #auth-toggle span { color: var(--accent); font-weight: 700; }
  #auth-modal-close { float: right; cursor: pointer; color: var(--text-muted); font-size: 18px; line-height: 1; }

  #onboarding-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 50; display: none;
    align-items: center; justify-content: center; padding: 20px;
  }
  #onboarding-backdrop.open { display: flex; }
  #onboarding-modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; width: 100%; max-width: 380px; max-height: 80vh; overflow-y: auto; }
  #onboarding-modal h2 { font-size: 18px; margin-bottom: 4px; }
  #onboarding-modal .sub { color: var(--text-sub); font-size: 12.5px; margin-bottom: 16px; }
  .onboarding-option { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; }
  .onboarding-option:last-of-type { border-bottom: none; }
  #onboarding-continue-btn {
    width: 100%; margin-top: 16px; background: var(--accent); color: #1a0a12; border: none;
    font-weight: 700; padding: 10px; border-radius: 999px; cursor: pointer; font-size: 14px;
  }
  #onboarding-skip { text-align: center; margin-top: 10px; font-size: 12.5px; color: var(--text-sub); cursor: pointer; }

  .follow-btn {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    border-radius: 999px; padding: 6px 14px; font-size: 12.5px; font-weight: 700; cursor: pointer; flex: none;
  }
  .follow-btn.following { background: var(--accent-dim); border-color: var(--accent); color: #fff; }
  .card-followed-tag { color: var(--accent); border-color: var(--accent); font-weight: 800; }
  .profile-link { cursor: pointer; text-decoration: underline; text-decoration-color: var(--border); }
  .profile-link:hover { color: var(--accent); text-decoration-color: var(--accent); }

  #my-collection-btn { font-size: 18px; background: none !important; border: none !important; padding: 4px !important; }
  #browse-btn { font-size: 18px; background: none !important; border: none !important; padding: 4px !important; flex: none; }

  .figure-action-btns { display: flex; gap: 8px; margin-top: 14px; }
  .action-btn {
    flex: 1; background: var(--card); border: 1px solid var(--border); color: var(--text);
    border-radius: 999px; padding: 9px; font-size: 12.5px; font-weight: 700; cursor: pointer; text-align: center;
  }
  .action-btn.active { background: var(--accent-dim); border-color: var(--accent); color: #fff; }

  .list-item {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; cursor: pointer;
  }
  .list-item:last-child { border-bottom: none; }
  .list-item-main { flex: 1; min-width: 0; }
  .list-item-name { font-weight: 700; }
  .list-item-sub { color: var(--text-muted); font-size: 12px; margin-top: 2px; }
  .list-item-price { color: var(--text-sub); font-size: 13px; white-space: nowrap; }
  .remove-btn {
    background: none; border: 1px solid var(--border); color: var(--text-muted);
    border-radius: 999px; padding: 4px 10px; font-size: 11.5px; cursor: pointer; flex: none;
  }
  .remove-btn:hover { color: var(--bad); border-color: var(--bad); }
  .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-sub); margin: 20px 0 8px; font-weight: 700; }
  .section-title:first-child { margin-top: 0; }
  .below-threshold-tag { color: var(--good); font-weight: 800; font-size: 11px; }

  .review-item { border-top: 1px solid var(--border); padding: 12px 0; }
  .review-item:first-of-type { border-top: none; }
  .review-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .review-stars { color: var(--accent); font-size: 14px; letter-spacing: 1px; }
  .review-author { color: var(--text-muted); font-size: 12px; }
  .review-text { font-size: 13px; color: var(--text-sub); line-height: 1.4; margin-bottom: 2px; }
  .rating-summary { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .rating-summary .review-stars { font-size: 17px; }
  .rating-count { color: var(--text-muted); font-size: 12.5px; }
  .star-picker { font-size: 24px; letter-spacing: 4px; margin: 6px 0; color: var(--accent); }
  .star-pick { cursor: pointer; }

  .contrib-item { border-top: 1px solid var(--border); padding: 10px 0; font-size: 13px; }
  .contrib-item:first-of-type { border-top: none; }
  .contrib-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .contrib-figure { font-weight: 700; }
  .contrib-technique { color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; }
  .contrib-claim { color: var(--text-sub); margin-bottom: 6px; }
  .vote-row { display: flex; align-items: center; gap: 8px; }
  .vote-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text-sub); border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
  .vote-btn.active-up { background: rgba(53,197,106,0.15); border-color: var(--good); color: var(--good); }
  .vote-btn.active-down { background: rgba(229,72,77,0.15); border-color: var(--bad); color: var(--bad); }
  .vote-score { font-size: 11.5px; color: var(--text-muted); }
</style>
</head>
<body>

<header>
  <div class="logo">🐷 Poop<span>Mart</span></div>
  <div style="position:relative; flex:1;">
    <input id="search" type="search" placeholder="Search Labubu, Crybaby, Skullpanda…" autocomplete="off" />
    <div id="search-results"></div>
  </div>
  <button id="browse-btn" title="Browse all series">🗂️</button>
  <div id="auth-area"></div>
</header>

<div id="auth-modal-backdrop">
  <div id="auth-modal">
    <span id="auth-modal-close">&times;</span>
    <h2 id="auth-modal-title">Sign in</h2>
    <div class="sub">Follow series, get notified, build your collection.</div>
    <form id="auth-form">
      <label>Email</label>
      <input type="email" name="email" required autocomplete="email" />
      <label>Password</label>
      <input type="password" name="password" required minlength="8" autocomplete="current-password" />
      <button type="submit">Sign in</button>
      <div id="auth-error"></div>
    </form>
    <div id="auth-toggle">Don't have an account? <span>Create one</span></div>
  </div>
</div>

<div id="onboarding-backdrop">
  <div id="onboarding-modal">
    <h2>Follow a few series to start</h2>
    <div class="sub">Your For You feed gets personalized around what you follow — pick a few, or skip for now.</div>
    <div id="onboarding-options"></div>
    <button id="onboarding-continue-btn">Continue</button>
    <div id="onboarding-skip">Skip for now</div>
  </div>
</div>

<div id="tabs"></div>

<main>
  <div id="feed-screen">
    <div id="feed"></div>
    <div id="empty" style="display:none;">Nothing here yet.</div>
  </div>

  <div id="detail">
    <div class="back-btn" id="back-btn">&larr; Back to feed</div>
    <div id="detail-content"></div>
  </div>
</main>

<script>
const TABS = [
  { id: "for_you", label: "For You" },
  { id: "trending", label: "Trending" },
  { id: "news", label: "News" },
  { id: "videos", label: "Videos" },
  { id: "collections", label: "Collections" },
  { id: "guides", label: "Guides" },
  { id: "marketplace", label: "Marketplace" },
];

const CARD_ICON = {
  trending: "📈", new_drop: "🆕", video: "🎥", community_post: "📷",
  price_change: "💰", whats_hot: "🔥", leak: "🕵️", review: "⭐",
  regional_news: "🌎", shake_guide: "🎲",
};

const CARD_LABEL = {
  trending: "Trending", new_drop: "New Drop", video: "Video", community_post: "Community",
  price_change: "Price Change", whats_hot: "What's Hot", leak: "Leak", review: "Review",
  regional_news: "Regional News", shake_guide: "Shake Guide",
};

/* ---------------- Auth state ---------------- */
const AUTH = {
  token: localStorage.getItem("poopmart_token") || null,
  email: localStorage.getItem("poopmart_email") || null,
};

function isLoggedIn() { return !!AUTH.token; }

function apiFetch(url, opts = {}) {
  const headers = Object.assign({}, opts.headers || {});
  if (AUTH.token) headers["Authorization"] = `Bearer ${AUTH.token}`;
  return fetch(url, Object.assign({}, opts, { headers }));
}

function setAuth(token, email) {
  AUTH.token = token;
  AUTH.email = email;
  localStorage.setItem("poopmart_token", token);
  localStorage.setItem("poopmart_email", email);
  renderAuthArea();
  loadFeed();
}

function clearAuth() {
  AUTH.token = null;
  AUTH.email = null;
  localStorage.removeItem("poopmart_token");
  localStorage.removeItem("poopmart_email");
  renderAuthArea();
  loadFeed();
}

let currentTab = "for_you";

const feedScreen = document.getElementById("feed-screen");
const detailScreen = document.getElementById("detail");
const feedEl = document.getElementById("feed");
const emptyEl = document.getElementById("empty");
const tabsEl = document.getElementById("tabs");
const authAreaEl = document.getElementById("auth-area");

/* ---------------- Auth area (header) ---------------- */

function renderAuthArea() {
  if (!isLoggedIn()) {
    authAreaEl.innerHTML = `<button id="sign-in-btn">Sign in</button>`;
    document.getElementById("sign-in-btn").addEventListener("click", () => openAuthModal("login"));
    return;
  }
  authAreaEl.innerHTML = `
    <button id="my-collection-btn" title="My Collection">📦</button>
    <div id="bell-wrap">
      <button id="bell-btn">🔔<span id="bell-badge">0</span></button>
      <div id="notif-dropdown"></div>
    </div>
    <span id="user-email">${AUTH.email}</span>
    <button id="sign-out-btn">Sign out</button>
  `;
  document.getElementById("sign-out-btn").addEventListener("click", clearAuth);
  document.getElementById("bell-btn").addEventListener("click", toggleNotifDropdown);
  document.getElementById("my-collection-btn").addEventListener("click", openMyCollection);
  refreshNotifications();
}

/* ---------------- My Collection screen ---------------- */

async function openMyCollection() {
  const [colRes, valRes, wishRes, meRes, rankingsRes, prefsRes] = await Promise.all([
    apiFetch("/api/collection"),
    apiFetch("/api/collection/valuation"),
    apiFetch("/api/wishlist"),
    apiFetch("/api/auth/me"),
    apiFetch("/api/rankings"),
    apiFetch("/api/notifications/preferences"),
  ]);
  const collection = (await colRes.json()).items;
  const valuation = await valRes.json();
  const wishlist = (await wishRes.json()).items;
  const me = await meRes.json();
  const rankings = (await rankingsRes.json()).rankings;
  const preferences = (await prefsRes.json()).preferences;

  const badgesHtml = me.badges.length
    ? me.badges.map((b) => `<span class="chip badge-chip" title="${b.description}">🏅 ${b.label}</span>`).join("")
    : "";

  const collectionHtml = collection.length
    ? collection
        .map(
          (i) => `
      <div class="list-item" data-figure-id="${i.figure_id}">
        <div class="list-item-main">
          <div class="list-item-name">${i.figure_name}</div>
          <div class="list-item-sub">
            ${i.condition || "condition not set"}
            <span class="profile-link" data-action="edit-condition" data-figure-id="${i.figure_id}" data-condition="${i.condition || ""}" data-photo="${i.photo_url || ""}">edit</span>
            · acquired ${new Date(i.acquired_at * 1000).toLocaleDateString()}
            <span class="profile-link" data-action="edit-acquired" data-figure-id="${i.figure_id}" data-condition2="${i.condition || ""}" data-photo2="${i.photo_url || ""}" data-acquired-date="${new Date(i.acquired_at * 1000).toISOString().slice(0, 10)}">edit</span>
            · ${i.photo_url && /^https?:\/\//i.test(i.photo_url) ? `<a href="${i.photo_url}" target="_blank" rel="noopener noreferrer">🖼️ view photo</a>` : "no photo"}
            <span class="profile-link" data-action="edit-photo" data-figure-id="${i.figure_id}" data-condition3="${i.condition || ""}" data-photo3="${i.photo_url || ""}">edit</span>
          </div>
        </div>

      <div class="list-item" data-ranking-id="${rk.id}">
        <div class="list-item-main">
          <div class="list-item-name">${rk.title}</div>
          <div class="list-item-sub">${rk.item_count} figure${rk.item_count === 1 ? "" : "s"}</div>
        </div>
      </div>`
        )
        .join("")
    : `<div class="sig-detail">No rankings yet — create one below, e.g. "My Top 10 Labubu Colorways".</div>`;

  showDetail(`
    <div class="detail-header">
      <h1>My Collection</h1>
      <div class="sub">${AUTH.email}</div>
      ${badgesHtml ? `<div class="card-meta" style="margin-top:8px;">${badgesHtml}</div>` : ""}
    </div>

    <div class="price-box">
      <h2>Collection Value</h2>
      <div class="price-now">$${valuation.total_value.toFixed(0)}</div>
      <div class="sig-detail">${valuation.priced_figure_count} of ${valuation.figure_count} figures priced</div>
    </div>

    <div class="guide-box">
      <div class="section-title">Collection (${collection.length})</div>
      ${collectionHtml}
      <div class="section-title">Wishlist (${wishlist.length})</div>
      ${wishlistHtml}
    </div>

    <div class="guide-box">
      <div class="section-title">Rankings (${rankings.length})</div>
      ${rankingsHtml}
      <form class="contrib-form" id="new-ranking-form" style="margin-top:0; padding-top:0; border-top:none;">
        <label>New ranking title</label>
        <input name="title" required placeholder='e.g. "My Top 10 Labubu Colorways"' />
        <button type="submit">Create</button>
      </form>
    </div>

    <div class="guide-box">
      <div class="section-title">Notification preferences</div>
      <label style="display:flex; align-items:center; gap:8px; font-weight:400; margin-bottom:10px;">
        <input type="checkbox" id="pref-followed_series_update" ${preferences.followed_series_update ? "checked" : ""} />
        Updates from series you follow
      </label>
      <label style="display:flex; align-items:center; gap:8px; font-weight:400;">
        <input type="checkbox" id="pref-followed_user_post" ${preferences.followed_user_post ? "checked" : ""} />
        Posts from collectors you follow
      </label>
    </div>

    <div class="guide-box">
      <div class="section-title">Account</div>
      <form class="contrib-form" id="change-password-form" style="margin-top:0; padding-top:0; border-top:none;">
        <label>Current password</label>
        <input type="password" name="current_password" required autocomplete="current-password" />
        <label>New password</label>
        <input type="password" name="new_password" required minlength="8" autocomplete="new-password" />
        <button type="submit">Change password</button>
        <div class="form-note" id="change-password-note">Password changed.</div>
        <div id="change-password-error" style="color:var(--bad); font-size:12.5px; margin-top:8px; display:none;"></div>
      </form>
    </div>
  `);

  const detailContent = document.getElementById("detail-content");
  detailContent.querySelectorAll('[data-action="remove-collection"]').forEach((el) =>
    el.addEventListener("click", async (e) => {
      e.stopPropagation();
      await apiFetch(`/api/collection/${el.dataset.figureId}`, { method: "DELETE" });
      openMyCollection();
    })
  );
  detailContent.querySelectorAll('[data-action="remove-wishlist"]').forEach((el) =>
    el.addEventListener("click", async (e) => {
      e.stopPropagation();
      await apiFetch(`/api/wishlist/${el.dataset.figureId}`, { method: "DELETE" });
      openMyCollection();
    })
  );
  detailContent.querySelectorAll('[data-action="edit-condition"]').forEach((el) =>
    el.addEventListener("click", async (e) => {
      e.stopPropagation();
      const next = prompt("Condition (e.g. Sealed, Opened, Displayed):", el.dataset.condition);
      if (next === null) return;
      await apiFetch("/api/collection", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          figure_id: el.dataset.figureId,
          condition: next.trim() || null,
          photo_url: el.dataset.photo || null,
        }),
      });
      openMyCollection();
    })
  );
  detailContent.querySelectorAll('[data-action="edit-acquired"]').forEach((el) =>
    el.addEventListener("click", async (e) => {
      e.stopPropagation();
      const next = prompt("Date acquired (YYYY-MM-DD):", el.dataset.acquiredDate);
      if (next === null) return;
      const trimmed = next.trim();
      const parsed = trimmed ? new Date(trimmed + "T00:00:00") : null;
      if (trimmed && (!parsed || isNaN(parsed.getTime()))) {
        alert("Enter a valid date as YYYY-MM-DD.");
        return;
      }
      await apiFetch("/api/collection", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          figure_id: el.dataset.figureId,
          condition: el.dataset.condition2 || null,
          photo_url: el.dataset.photo2 || null,
          acquired_at: parsed ? Math.floor(parsed.getTime() / 1000) : null,
        }),
      });
      openMyCollection();
    })
  );
  detailContent.querySelectorAll('[data-action="edit-photo"]').forEach((el) =>
    el.addEventListener("click", async (e) => {
      e.stopPropagation();
      const next = prompt("Photo link (URL, blank to clear):", el.dataset.photo3);
      if (next === null) return;
      const trimmed = next.trim();
      if (trimmed && !/^https?:\/\//i.test(trimmed)) {
        alert("Enter a link starting with http:// or https://, or leave blank to clear.");
        return;
      }
      await apiFetch("/api/collection", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          figure_id: el.dataset.figureId,
          condition: el.dataset.condition3 || null,
          photo_url: trimmed || null,
        }),
      });
      openMyCollection();
    })
  );
  detailContent.querySelectorAll('[data-action="edit-alert"]').forEach((el) =>
    el.addEventListener("click", async (e) => {
      e.stopPropagation();
      const raw = prompt("Alert me when the price drops to or below ($, blank to clear):", el.dataset.threshold);
      if (raw === null) return;
      const trimmed = raw.trim();
      let threshold = null;
      if (trimmed) {
        const parsed = Number(trimmed);
        if (!Number.isFinite(parsed) || parsed < 0) {
          alert("Enter a valid non-negative number, or leave blank to clear the alert.");
          return;
        }
        threshold = parsed;
      }
      await apiFetch("/api/wishlist", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ figure_id: el.dataset.figureId, alert_threshold: threshold }),
      });
      openMyCollection();
    })
  );
  detailContent.querySelectorAll(".list-item").forEach((el) =>
    el.addEventListener("click", (e) => {
      if (e.target.closest(".remove-btn") || e.target.closest("[data-action]")) return;
      if (el.dataset.rankingId) openRanking(el.dataset.rankingId);
      else openFigure(el.dataset.figureId);
    })
  );

  ["followed_series_update", "followed_user_post"].forEach((category) => {
    document.getElementById(`pref-${category}`).addEventListener("change", async (e) => {
      await apiFetch(`/api/notifications/preferences/${category}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ enabled: e.target.checked }),
      });
    });
  });

  const newRankingForm = document.getElementById("new-ranking-form");
  newRankingForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(newRankingForm);
    const res = await apiFetch("/api/rankings", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title: fd.get("title") }),
    });
    if (res.ok) openMyCollection();
  });

  const changePasswordForm = document.getElementById("change-password-form");
  const changePasswordError = document.getElementById("change-password-error");
  changePasswordForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    changePasswordError.style.display = "none";
    const fd = new FormData(changePasswordForm);
    const res = await apiFetch("/api/auth/change-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        current_password: fd.get("current_password"),
        new_password: fd.get("new_password"),
      }),
    });
    const data = await res.json();
    if (res.ok) {
      document.getElementById("change-password-note").classList.add("show");
      changePasswordForm.reset();
    } else {
      changePasswordError.textContent = data.detail || "Could not change password.";
      changePasswordError.style.display = "block";
    }
  });
}

/* ---------------- Ranking detail screen ---------------- */

async function openRanking(rankingId) {
  const res = await fetch(`/api/rankings/${rankingId}`);
  if (!res.ok) {
    showDetail(`<div class="detail-header"><h1>Ranking not found</h1></div>`);
    return;
  }
  const ranking = await res.json();
  const isOwner = isLoggedIn() && AUTH.email.split("@")[0] === ranking.owner;

  const itemsHtml = ranking.items.length
    ? ranking.items
        .map(
          (item, idx) => `
      <div class="list-item" data-figure-id="${item.figure_id}">
        <div class="list-item-main">
          <div class="list-item-name">#${idx + 1} ${item.figure_name}</div>
        </div>
        ${isOwner ? `<button class="remove-btn" data-action="remove-ranking-item" data-figure-id="${item.figure_id}">Remove</button>` : ""}
      </div>`
        )
        .join("")
    : `<div class="sig-detail">No figures added yet.</div>`;

  let isFollowingOwner = false;
  if (isLoggedIn() && !isOwner) {
    const followsRes = await apiFetch("/api/follows/users");
    if (followsRes.ok) {
      const followsData = await followsRes.json();
      isFollowingOwner = followsData.users.some((u) => u.user_id === ranking.owner_id);
    }
  }
  const followOwnerBtnHtml = isOwner
    ? ""
    : isLoggedIn()
    ? `<button class="follow-btn ${isFollowingOwner ? "following" : ""}" id="follow-owner-btn">${isFollowingOwner ? "✓ Following" : "+ Follow"}</button>`
    : `<button class="follow-btn" id="follow-owner-btn">Sign in to follow</button>`;

  let addFormHtml = "";
  if (isOwner) {
    const figuresData = await (await fetch("/api/figures")).json();
    const existingIds = new Set(ranking.items.map((i) => i.figure_id));
    const options = figuresData.figures
      .filter((f) => !existingIds.has(f.id))
      .map((f) => `<option value="${f.id}">${f.name}</option>`)
      .join("");
    addFormHtml = options
      ? `<form class="contrib-form" id="add-ranking-item-form" style="margin-top:16px;">
           <label>Add a figure</label>
           <select name="figure_id" required>${options}</select>
           <button type="submit">Add</button>
         </form>`
      : `<div class="sig-detail" style="margin-top:12px;">All figures are already on this list.</div>`;
  }

  showDetail(`
    <div class="detail-header">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px;">
        <div>
          <h1>${ranking.title}</h1>
          <div class="sub">by <span class="profile-link" id="ranking-owner-link">@${ranking.owner}</span></div>
        </div>
        ${followOwnerBtnHtml}
      </div>
    </div>
    <div class="guide-box">
      <div class="section-title">Ranked Figures</div>
      ${itemsHtml}
      ${addFormHtml}
      ${isOwner ? `<button class="remove-btn" id="delete-ranking-btn" style="margin-top:16px;">Delete this ranking</button>` : ""}
    </div>
  `);

  const detailContent = document.getElementById("detail-content");
  detailContent.querySelectorAll('[data-action="remove-ranking-item"]').forEach((el) =>
    el.addEventListener("click", async (e) => {
      e.stopPropagation();
      await apiFetch(`/api/rankings/${rankingId}/items/${el.dataset.figureId}`, { method: "DELETE" });
      openRanking(rankingId);
    })
  );
  detailContent.querySelectorAll(".list-item").forEach((el) =>
    el.addEventListener("click", (e) => {
      if (e.target.closest(".remove-btn")) return;
      openFigure(el.dataset.figureId);
    })
  );

  const addForm = document.getElementById("add-ranking-item-form");
  if (addForm) {
    addForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(addForm);
      await apiFetch(`/api/rankings/${rankingId}/items`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ figure_id: fd.get("figure_id") }),
      });
      openRanking(rankingId);
    });
  }

  const deleteRankingBtn = document.getElementById("delete-ranking-btn");
  if (deleteRankingBtn) {
    deleteRankingBtn.addEventListener("click", async () => {
      await apiFetch(`/api/rankings/${rankingId}`, { method: "DELETE" });
      openMyCollection();
    });
  }

  const followOwnerBtn = document.getElementById("follow-owner-btn");
  if (followOwnerBtn) {
    followOwnerBtn.addEventListener("click", async () => {
      if (!isLoggedIn()) {
        openAuthModal("login");
        return;
      }
      const method = isFollowingOwner ? "DELETE" : "POST";
      const res = await apiFetch(`/api/follows/users/${ranking.owner_id}`, { method });
      if (res.ok) openRanking(rankingId);
    });
  }

  const ownerLink = document.getElementById("ranking-owner-link");
  if (ownerLink) {
    ownerLink.addEventListener("click", (e) => {
      e.stopPropagation();
      openUserProfile(ranking.owner_id);
    });
  }
}

  const followBtnHtml = isSelf
    ? ""

    ? `<button class="follow-btn ${profile.viewer_is_following ? "following" : ""}" id="follow-profile-btn">${profile.viewer_is_following ? "✓ Following" : "+ Follow"}</button>`
    : `<button class="follow-btn" id="follow-profile-btn">Sign in to follow</button>`;

  showDetail(`
    <div class="detail-header">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px;">
        <div>
          <h1>@${profile.handle}</h1>
          <div class="sub">${profile.follower_count} follower${profile.follower_count === 1 ? "" : "s"} · ${profile.following_count} following</div>
          ${badgesHtml ? `<div class="card-meta" style="margin-top:8px;">${badgesHtml}</div>` : ""}
        </div>
        ${followBtnHtml}
      </div>
    </div>
    <div class="guide-box">
      <div class="section-title">Rankings (${profile.rankings.length})</div>
      ${rankingsHtml}
    </div>
    <div class="guide-box">
      <div class="section-title">Pulls &amp; Posts (${profile.posts.length})</div>
      ${postsHtml}
    </div>
    <div class="guide-box">
      <div class="section-title">Reviews (${profile.reviews.length})</div>
      ${reviewsHtml}

  const detailContent = document.getElementById("detail-content");
  detailContent.querySelectorAll(".list-item").forEach((el) =>
    el.addEventListener("click", (e) => {
      if (e.target.closest(".remove-btn")) return;
      if (el.dataset.rankingId) openRanking(el.dataset.rankingId);
      else openFigure(el.dataset.figureId);
    })
  );
  detailContent.querySelectorAll('[data-action="remove-post"]').forEach((el) =>
    el.addEventListener("click", async (e) => {
      e.stopPropagation();
      await apiFetch(`/api/feed/posts/${el.dataset.postId}`, { method: "DELETE" });
      openUserProfile(userId);
    })
  );

  const followProfileBtn = document.getElementById("follow-profile-btn");
  if (followProfileBtn) {
    followProfileBtn.addEventListener("click", async () => {
      if (!isLoggedIn()) {
        openAuthModal("login");
        return;
      }

      if (res.ok) openUserProfile(userId);
    });

}

/* ---------------- Notifications ---------------- */

let notifCache = { unread_count: 0, notifications: [] };

async function refreshNotifications() {
  if (!isLoggedIn()) return;
  const res = await apiFetch("/api/notifications");
  if (!res.ok) return;
  notifCache = await res.json();
  const badge = document.getElementById("bell-badge");
  if (!badge) return;
  if (notifCache.unread_count > 0) {
    badge.style.display = "flex";
    badge.textContent = notifCache.unread_count > 9 ? "9+" : notifCache.unread_count;
  } else {
    badge.style.display = "none";
  }
}

function notifItemHtml(n) {
  return `<div class="notif-item ${n.read_at ? "" : "unread"}" data-id="${n.id}">
    <div class="notif-title">${n.title}</div>
    <div>${n.body || ""}</div>
    <div class="notif-time">${timeAgo(n.created_at)}</div>
  </div>`;
}

function toggleNotifDropdown() {
  const dd = document.getElementById("notif-dropdown");
  if (!dd) return;
  const opening = !dd.classList.contains("open");
  dd.classList.toggle("open");
  if (!opening) return;
  dd.innerHTML = notifCache.notifications.length
    ? notifCache.notifications.map(notifItemHtml).join("")
    : `<div class="notif-empty">No notifications yet — follow a series to get updates.</div>`;
  dd.querySelectorAll(".notif-item").forEach((el) =>
    el.addEventListener("click", async (ev) => {
      ev.stopPropagation();
      await apiFetch(`/api/notifications/${el.dataset.id}/read`, { method: "POST" });
      el.classList.remove("unread");
      refreshNotifications();
    })
  );
}

document.addEventListener("click", (e) => {
  if (!e.target.closest("#bell-wrap")) {
    const dd = document.getElementById("notif-dropdown");
    if (dd) dd.classList.remove("open");
  }
});

/* ---------------- Auth modal ---------------- */

let authMode = "login";
const authBackdrop = document.getElementById("auth-modal-backdrop");
const authForm = document.getElementById("auth-form");
const authError = document.getElementById("auth-error");

function openAuthModal(mode) {
  authMode = mode;
  document.getElementById("auth-modal-title").textContent = mode === "login" ? "Sign in" : "Create account";
  authForm.querySelector('button[type="submit"]').textContent = mode === "login" ? "Sign in" : "Create account";
  document.getElementById("auth-toggle").innerHTML =
    mode === "login"
      ? `Don't have an account? <span>Create one</span>`
      : `Already have an account? <span>Sign in</span>`;
  authError.classList.remove("show");
  authForm.reset();
  authBackdrop.classList.add("open");
}

document.getElementById("auth-modal-close").addEventListener("click", () => authBackdrop.classList.remove("open"));
authBackdrop.addEventListener("click", (e) => {
  if (e.target === authBackdrop) authBackdrop.classList.remove("open");
});
document.getElementById("auth-toggle").addEventListener("click", () => openAuthModal(authMode === "login" ? "signup" : "login"));

authForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const fd = new FormData(authForm);
  const email = fd.get("email");
  const password = fd.get("password");
  const endpoint = authMode === "login" ? "/api/auth/login" : "/api/auth/signup";
  const res = await fetch(endpoint, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password }),
  });
  const data = await res.json();
  if (!res.ok) {
    authError.textContent = data.detail || "Something went wrong.";
    authError.classList.add("show");
    return;
  }
  const wasSignup = authMode === "signup";
  setAuth(data.access_token, data.email);
  authBackdrop.classList.remove("open");
  if (wasSignup) openOnboarding();
});

/* ---------------- Signup onboarding: follow a few series ---------------- */

const onboardingBackdrop = document.getElementById("onboarding-backdrop");

async function openOnboarding() {
  const res = await fetch("/api/series");
  const data = await res.json();
  const optionsEl = document.getElementById("onboarding-options");
  optionsEl.innerHTML = data.series
    .map(
      (s) => `
    <label class="onboarding-option">
      <input type="checkbox" name="onboarding-series" value="${s.id}" />
      ${s.name} <span style="color:var(--text-muted);">· ${s.brand_line}</span>
    </label>`
    )
    .join("");
  onboardingBackdrop.classList.add("open");
}

function closeOnboarding() {
  onboardingBackdrop.classList.remove("open");
  loadFeed();
}

document.getElementById("onboarding-skip").addEventListener("click", closeOnboarding);

document.getElementById("onboarding-continue-btn").addEventListener("click", async () => {

function renderTabs() {
  tabsEl.innerHTML = TABS.map(
    (t) => `<div class="tab ${t.id === currentTab ? "active" : ""}" data-tab="${t.id}">${t.label}</div>`
  ).join("");
  tabsEl.querySelectorAll(".tab").forEach((el) =>
    el.addEventListener("click", () => {
      currentTab = el.dataset.tab;
      renderTabs();
      loadFeed();
    })
  );
}

function timeAgo(unixSeconds) {
  const diff = Math.max(0, Date.now() / 1000 - unixSeconds);
  if (diff < 3600) return Math.floor(diff / 60) + "m ago";
  if (diff < 86400) return Math.floor(diff / 3600) + "h ago";
  return Math.floor(diff / 86400) + "d ago";
}

function cardHtml(card) {
  const icon = CARD_ICON[card.card_type] || "•";
  const label = CARD_LABEL[card.card_type] || card.card_type;
  const meta = [];
  if (card.region) meta.push(`<span class="chip">${card.region}</span>`);
  if (card.sentiment_score != null) meta.push(`<span class="chip">Sentiment ${Math.round(card.sentiment_score * 100)}%</span>`);
  if (card.source_counts) {
    const sc = card.source_counts;
    const parts = [];
    if (sc.videos) parts.push(`🎥${sc.videos}`);
    if (sc.news) parts.push(`📰${sc.news}`);
    if (sc.discussions) parts.push(`💬${sc.discussions}`);
    if (parts.length) meta.push(`<span class="chip">${parts.join(" ")}</span>`);
  }
  meta.push(`<span class="chip trust-${card.source_trust_tier}">${card.source_trust_tier.replace("_", " ")}</span>`);
  meta.push(`<span class="chip">${timeAgo(card.created_at)}</span>`);
  if (card.poster) meta.push(`<span class="chip profile-link" data-poster-id="${card.poster_id}">by @${card.poster}</span>`);
  if (card.followed) meta.push(`<span class="chip card-followed-tag">★ Following</span>`);

  return `
    <div class="card" data-figure-id="${card.figure_id || ""}" data-series-id="${card.series_id || ""}">
      <div class="card-top"><span class="card-icon">${icon}</span><span class="card-type-label">${label}</span></div>
      <div class="card-title">${card.title}</div>
      <div class="card-body">${card.body}</div>
      <div class="card-meta">${meta.join("")}</div>
    </div>`;
}

async function loadFeed() {
  feedEl.innerHTML = "";
  const res = await apiFetch(`/api/feed?tab=${currentTab}`);
  const data = await res.json();
  emptyEl.style.display = data.cards.length ? "none" : "block";
  feedEl.innerHTML = data.cards.map(cardHtml).join("");
  feedEl.querySelectorAll(".card").forEach((el) =>
    el.addEventListener("click", (e) => {
      const posterChip = e.target.closest("[data-poster-id]");
      if (posterChip) {
        e.stopPropagation();
        openUserProfile(posterChip.dataset.posterId);
        return;
      }
      const figureId = el.dataset.figureId;
      const seriesId = el.dataset.seriesId;
      if (figureId) openFigure(figureId);
      else if (seriesId) openSeries(seriesId);
    })
  );
}

async function openBrowseSeries() {
  const [seriesRes, figuresRes] = await Promise.all([fetch("/api/series"), fetch("/api/figures")]);
  const series = (await seriesRes.json()).series;
  const figures = (await figuresRes.json()).figures;

  const countBySeriesId = {};
  figures.forEach((f) => {
    countBySeriesId[f.series_id] = (countBySeriesId[f.series_id] || 0) + 1;
  });

  const seriesHtml = series.length
    ? series
        .map(
          (s) => `
      <div class="list-item" data-series-id="${s.id}">
        <div class="list-item-main">
          <div class="list-item-name">${s.name}</div>
          <div class="list-item-sub">${s.brand_line} · ${countBySeriesId[s.id] || 0} figures</div>
        </div>
      </div>`
        )
        .join("")
    : `<div class="sig-detail">No series in the catalog yet.</div>`;

  showDetail(`
    <div class="detail-header">
      <h1>Browse All Series</h1>
      <div class="sub">${series.length} series in the catalog</div>
    </div>
    <div class="guide-box">
      ${seriesHtml}
    </div>
  `);

  document.getElementById("detail-content").querySelectorAll(".list-item").forEach((el) =>
    el.addEventListener("click", () => openSeries(el.dataset.seriesId))
  );
}

function starsHtml(rating) {
  const full = Math.round(rating);
  return "★".repeat(full) + "☆".repeat(5 - full);
}

function priceChartSvg(history) {
  if (!history.length) return "";
  const w = 600, h = 80, pad = 4;
  // Per PRICE_TRACKING_DESIGN.md, price is an aggregate with a confidence
  // band (low/high), not a single point value -- the chart previously only
  // ever plotted median_price and ignored low_price/high_price entirely.
  const hasBand = history.every((p) => p.low_price != null && p.high_price != null);
  const allValues = hasBand
    ? history.flatMap((p) => [p.low_price, p.high_price])
    : history.map((p) => p.median_price);
  const min = Math.min(...allValues), max = Math.max(...allValues);
  const range = max - min || 1;
  const xFor = (i) => pad + (i / (history.length - 1 || 1)) * (w - pad * 2);
  const yFor = (v) => h - pad - ((v - min) / range) * (h - pad * 2);

  const medianPts = history.map((p, i) => `${xFor(i).toFixed(1)},${yFor(p.median_price).toFixed(1)}`);

  let bandHtml = "";
  if (hasBand) {
    const topPts = history.map((p, i) => `${xFor(i).toFixed(1)},${yFor(p.high_price).toFixed(1)}`);
    const bottomPts = history
      .map((p, i) => `${xFor(i).toFixed(1)},${yFor(p.low_price).toFixed(1)}`)
      .reverse();
    bandHtml = `<polygon points="${topPts.join(" ")} ${bottomPts.join(" ")}" fill="#ff5da2" fill-opacity="0.12" stroke="none" />`;
  }

  const up = history[history.length - 1].median_price >= history[0].median_price;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    ${bandHtml}
    <polyline points="${medianPts.join(" ")}" fill="none" stroke="${up ? "#35c56a" : "#e5484d"}" stroke-width="2.5" />
  </svg>`;
}

async function openFigure(figureId) {
  const [figRes, priceRes, reviewsRes] = await Promise.all([
    fetch(`/api/figures/${figureId}`),
    fetch(`/api/figures/${figureId}/price-history`),
    apiFetch(`/api/figures/${figureId}/reviews`),
  ]);
  const fig = await figRes.json();
  const price = await priceRes.json();
  const reviewsData = await reviewsRes.json();
  const history = price.history;
  const current = fig.current_price;
  const first = history[0];
  let deltaHtml = "";
  if (current && first && history.length > 1) {
    const pct = ((current.median_price - first.median_price) / first.median_price) * 100;
    const cls = pct >= 0 ? "up" : "down";
    deltaHtml = `<span class="delta ${cls}">${pct >= 0 ? "+" : ""}${pct.toFixed(1)}%</span>`;
  }

  const priceBox = current
    ? `<div class="price-box">
         <h2>Resale Price</h2>
         <div class="price-now">$${current.median_price.toFixed(0)} ${deltaHtml}</div>
         ${current.listing_count != null ? `<div class="sig-detail">Based on ${current.listing_count} listing${current.listing_count === 1 ? "" : "s"}${current.listing_count < 10 ? " — low confidence" : ""}</div>` : ""}
         ${priceChartSvg(history)}
       </div>`
    : `<div class="price-box"><h2>Resale Price</h2><div class="sig-detail">Not enough listings tracked yet.</div></div>`;

  let inCollection = false, onWishlist = false;
  if (isLoggedIn()) {
    const [colRes, wishRes] = await Promise.all([apiFetch("/api/collection"), apiFetch("/api/wishlist")]);
    if (colRes.ok) inCollection = (await colRes.json()).items.some((i) => i.figure_id === figureId);
    if (wishRes.ok) onWishlist = (await wishRes.json()).items.some((i) => i.figure_id === figureId);
  }

  const actionBtns = isLoggedIn()
    ? `<div class="figure-action-btns">
         <button class="action-btn ${inCollection ? "active" : ""}" id="collection-btn">${inCollection ? "✓ In Collection" : "+ Add to Collection"}</button>
         <button class="action-btn ${onWishlist ? "active" : ""}" id="wishlist-btn">${onWishlist ? "✓ On Wishlist" : "+ Add to Wishlist"}</button>
       </div>`
    : `<div class="figure-action-btns">
         <button class="action-btn" id="collection-btn">Sign in to add to collection or wishlist</button>
       </div>`;

  const ratingSummaryHtml = reviewsData.review_count > 0
    ? `<div class="rating-summary">
         <span class="review-stars">${starsHtml(reviewsData.average_rating)}</span>
         <span>${reviewsData.average_rating.toFixed(1)}</span>
         <span class="rating-count">(${reviewsData.review_count} review${reviewsData.review_count === 1 ? "" : "s"})</span>
       </div>`
    : `<div class="sig-detail" style="margin-bottom:12px;">No reviews yet.</div>`;

  const reviewsListHtml = reviewsData.reviews.length
    ? reviewsData.reviews
        .map(
          (r) => `
      <div class="review-item" data-review-id="${r.id}">
        <div class="review-top"><span class="review-stars">${starsHtml(r.rating)}</span><span class="review-author">@${r.reviewer}</span></div>
        ${r.text ? `<div class="review-text">${r.text}</div>` : ""}
        <div class="vote-row">
          <button class="vote-btn review-vote-btn ${r.my_vote === "helpful" ? "active-up" : ""}" data-direction="helpful">👍 ${r.helpful_count}</button>
          <button class="vote-btn review-vote-btn ${r.my_vote === "unhelpful" ? "active-down" : ""}" data-direction="unhelpful">👎 ${r.unhelpful_count}</button>
          <span class="vote-score">${timeAgo(r.created_at)}</span>
        </div>
      </div>`
        )
        .join("")
    : "";

  const myRating = reviewsData.my_review ? reviewsData.my_review.rating : 0;
  const reviewFormHtml = isLoggedIn()
    ? `<form class="contrib-form" id="review-form">
         <div style="font-size:13px; font-weight:700;">${reviewsData.my_review ? "Update your review" : "Write a review"}</div>
         <div class="star-picker" id="star-picker">
           ${[1, 2, 3, 4, 5].map((n) => `<span class="star-pick" data-value="${n}">${n <= myRating ? "★" : "☆"}</span>`).join("")}
         </div>
         <input type="hidden" name="rating" value="${myRating}" />
         <textarea name="text" rows="2" placeholder="What do you think of this figure?">${(reviewsData.my_review && reviewsData.my_review.text) || ""}</textarea>
         <button type="submit">Submit review</button>
         <div class="form-note" id="review-note">Saved.</div>
       </form>`
    : `<div class="sig-detail">Sign in to leave a review.</div>`;

  const postFormHtml = isLoggedIn()
    ? `<form class="contrib-form" id="community-post-form" style="margin-top:0; padding-top:0; border-top:none;">
         <label>Title</label>
         <input name="title" required placeholder="e.g. Finally pulled it!" />
         <label>Tell the story</label>
         <textarea name="body" rows="2" required placeholder="How many boxes did it take?"></textarea>
         <button type="submit">Post</button>
         <div class="form-note" id="community-post-note">Posted to the feed.</div>
       </form>`
    : `<div class="sig-detail">Sign in to share your pull.</div>`;

  showDetail(`
    <div class="detail-header">
      <h1>${fig.figure.name}</h1>
      <div class="sub">${fig.figure.colorway || ""} ${fig.figure.is_secret_chase ? "· 🔒 Secret" : ""}</div>
    </div>
    ${priceBox}
    ${actionBtns}
    <div class="guide-box" style="margin-top:16px;">
      <h2>📷 Share Your Pull</h2>
      ${postFormHtml}
    </div>
    <div class="guide-box">
      <h2>⭐ Reviews</h2>
      ${ratingSummaryHtml}
      ${reviewsListHtml}
      ${reviewFormHtml}
    </div>
    <div style="text-align:center; margin-top:16px;">
      <span class="back-btn" data-series="${fig.figure.series_id}" id="view-series-link">View full series &amp; Shake Guide &rarr;</span>
    </div>
  `);
  document.getElementById("view-series-link").addEventListener("click", () => openSeries(fig.figure.series_id));

  const communityPostForm = document.getElementById("community-post-form");
  if (communityPostForm) {
    communityPostForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(communityPostForm);
      const res = await apiFetch("/api/feed/posts", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ figure_id: figureId, title: fd.get("title"), body: fd.get("body") }),
      });
      if (res.ok) {
        document.getElementById("community-post-note").classList.add("show");
        communityPostForm.reset();
      }
    });
  }

  const reviewForm = document.getElementById("review-form");
  if (reviewForm) {
    const starPicker = document.getElementById("star-picker");
    starPicker.querySelectorAll(".star-pick").forEach((el) => {
      el.addEventListener("click", () => {
        const val = parseInt(el.dataset.value, 10);
        reviewForm.querySelector('[name="rating"]').value = val;
        starPicker.querySelectorAll(".star-pick").forEach((s) => {
          s.textContent = parseInt(s.dataset.value, 10) <= val ? "★" : "☆";
        });
      });
    });
    reviewForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(reviewForm);
      const rating = parseInt(fd.get("rating"), 10);
      if (!rating) return;
      const res = await apiFetch(`/api/figures/${figureId}/reviews`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ rating, text: fd.get("text") || null }),
      });
      if (res.ok) {
        document.getElementById("review-note").classList.add("show");
        setTimeout(() => openFigure(figureId), 700);
      }
    });
  }

  document.getElementById("collection-btn").addEventListener("click", async () => {
    if (!isLoggedIn()) {
      openAuthModal("login");
      return;
    }
    if (inCollection) {
      await apiFetch(`/api/collection/${figureId}`, { method: "DELETE" });
    } else {
      await apiFetch("/api/collection", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ figure_id: figureId }),
      });
    }
    openFigure(figureId);
  });

  const wishlistBtn = document.getElementById("wishlist-btn");
  if (wishlistBtn) {
    wishlistBtn.addEventListener("click", async () => {
      if (onWishlist) {
        await apiFetch(`/api/wishlist/${figureId}`, { method: "DELETE" });
      } else {
        await apiFetch("/api/wishlist", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ figure_id: figureId }),
        });
      }
      openFigure(figureId);
    });
  }

  document.getElementById("detail-content").querySelectorAll(".review-vote-btn").forEach((btn) => {
    btn.addEventListener("click", async () => {
      if (!isLoggedIn()) {
        openAuthModal("login");
        return;
      }
      const reviewId = btn.closest(".review-item").dataset.reviewId;
      const res = await apiFetch(`/api/reviews/${reviewId}/vote`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ direction: btn.dataset.direction }),
      });
      if (res.ok) openFigure(figureId);
    });
  });
}

async function openSeries(seriesId) {
  const [seriesRes, guideRes] = await Promise.all([
    fetch(`/api/series/${seriesId}`),
    apiFetch(`/api/guides/${seriesId}`),
  ]);
  const seriesData = await seriesRes.json();
  const guide = await guideRes.json();

  const figuresOptions = seriesData.figures
    .map((f) => `<option value="${f.id}">${f.name}${f.is_secret_chase ? " (secret)" : ""}</option>`)
    .join("");

  const signaturesHtml = guide.figure_signatures.length
    ? guide.figure_signatures
        .map(
          (s) => `
      <div class="signature">
        <div class="sig-row"><span class="sig-name">${s.figure_name}</span><span class="sig-conf">${s.confidence_score}% confidence · ${s.contribution_count} contributions</span></div>
        <div class="conf-bar"><div class="conf-bar-fill" style="width:${s.confidence_score}%"></div></div>
        <div class="sig-detail">${s.weight_range_g ? "⚖️ " + s.weight_range_g : ""} ${s.sound_description ? " · 🔊 " + s.sound_description : ""} ${s.distinguishing_notes ? " · " + s.distinguishing_notes : ""}</div>
      </div>`
        )
        .join("")
    : `<div class="sig-detail">Not enough data yet — be the first to add a tell below.</div>`;

  const contributionsHtml = guide.contributions.length
    ? guide.contributions
        .slice(0, 20)
        .map((c) => {
          const fig = seriesData.figures.find((f) => f.id === c.figure_id);
          const net = c.upvotes - c.downvotes;
          const isMine = isLoggedIn() && c.contributor && AUTH.email.split("@")[0] === c.contributor;
          return `
      <div class="contrib-item" data-contribution-id="${c.id}">
        <div class="contrib-top">
          <span class="contrib-figure">${fig ? fig.name : c.figure_id}</span>
          <span class="contrib-technique">${c.technique_type}</span>
        </div>
        <div class="contrib-claim">${c.claim_text}</div>
        ${c.video_url && /^https?:\/\//i.test(c.video_url) ? `<div class="contrib-claim"><a href="${c.video_url}" target="_blank" rel="noopener noreferrer">🎥 watch demo clip</a></div>` : ""}
        <div class="vote-row">
          <button class="vote-btn ${c.my_vote === "up" ? "active-up" : ""}" data-direction="up">▲ ${c.upvotes}</button>
          <button class="vote-btn ${c.my_vote === "down" ? "active-down" : ""}" data-direction="down">▼ ${c.downvotes}</button>
          <span class="vote-score">net ${net >= 0 ? "+" : ""}${net}</span>
          <span class="vote-score">${c.contributor ? "by @" + c.contributor : "community"}</span>
          ${isMine ? `<button class="remove-btn" data-action="remove-contribution">Remove</button>` : ""}
        </div>
      </div>`;
        })
        .join("")
    : "";

  let isFollowing = false;
  if (isLoggedIn()) {
    const followsRes = await apiFetch("/api/follows/series");
    if (followsRes.ok) {
      const followsData = await followsRes.json();
      isFollowing = followsData.series.some((s) => s.series_id === seriesId);
    }
  }
  const followBtnHtml = isLoggedIn()
    ? `<button class="follow-btn ${isFollowing ? "following" : ""}" id="follow-btn">${isFollowing ? "✓ Following" : "+ Follow"}</button>`
    : `<button class="follow-btn" id="follow-btn">Sign in to follow</button>`;

  showDetail(`
    <div class="detail-header">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px;">
        <div>
          <h1>${seriesData.series.name}</h1>
          <div class="sub">${seriesData.series.brand_line} · ${seriesData.figures.length} figures</div>
        </div>
        ${followBtnHtml}
      </div>
    </div>

    <div class="guide-box">
      <h2>🎲 Shake Guide</h2>
      <div class="sig-detail" style="margin-bottom:12px;">${guide.technique_summary}</div>
      <div class="etiquette">${guide.etiquette_note}</div>
      ${signaturesHtml}

      ${contributionsHtml ? `<div class="section-title">Recent Tells</div>${contributionsHtml}` : ""}

      ${isLoggedIn() ? `<form class="contrib-form" id="contrib-form">
        <div style="font-size:13px; font-weight:700;">Add your tell</div>
        <label>Figure</label>
        <select name="figure_id" required>${figuresOptions}</select>
        <label>Technique</label>
        <select name="technique_type" required>
          <option value="weight">⚖️ Weight</option>
          <option value="sound">🔊 Sound / Rattle</option>
          <option value="box_code">🔢 Box Code</option>
          <option value="seam">✂️ Seam / Sticker Pattern</option>
        </select>
        <label>What did you notice?</label>
        <textarea name="claim_text" rows="2" required placeholder="e.g. 47g, faint rattle near the top"></textarea>
        <label>Weight range (optional)</label>
        <input name="weight_range_g" placeholder="e.g. 46-48g" />
        <label>Video link (optional)</label>
        <input name="video_url" type="url" placeholder="e.g. link to your demo clip on TikTok/YouTube" />
        <button type="submit">Submit</button>
        <div class="form-note" id="contrib-note">Thanks — added to the guide.</div>
      </form>` : `<div class="contrib-form"><button class="action-btn" id="contrib-signin-btn">Sign in to add a tell</button></div>`}
    </div>
  `);

  const contribForm = document.getElementById("contrib-form");
  if (contribForm) {
    contribForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(contribForm);
      const body = {
        figure_id: fd.get("figure_id"),
        technique_type: fd.get("technique_type"),
        claim_text: fd.get("claim_text"),
        weight_range_g: fd.get("weight_range_g") || null,
        video_url: fd.get("video_url") || null,
      };
      const res = await apiFetch(`/api/guides/${seriesId}/contributions`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (res.ok) {
        document.getElementById("contrib-note").classList.add("show");
        setTimeout(() => openSeries(seriesId), 700);
      }
    });
  } else {
    document.getElementById("contrib-signin-btn").addEventListener("click", () => openAuthModal("login"));
  }

  document.getElementById("follow-btn").addEventListener("click", async () => {
    if (!isLoggedIn()) {
      openAuthModal("login");
      return;
    }
    const method = isFollowing ? "DELETE" : "POST";
    const res = await apiFetch(`/api/follows/series/${seriesId}`, { method });
    if (res.ok) openSeries(seriesId);
  });

  document.getElementById("detail-content").querySelectorAll(".vote-btn").forEach((btn) => {
    btn.addEventListener("click", async () => {
      if (!isLoggedIn()) {
        openAuthModal("login");
        return;
      }
      const contributionId = btn.closest(".contrib-item").dataset.contributionId;
      const res = await apiFetch(`/api/guides/contributions/${contributionId}/vote`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ direction: btn.dataset.direction }),
      });
      if (res.ok) openSeries(seriesId);
    });
  });

  document.getElementById("detail-content").querySelectorAll('[data-action="remove-contribution"]').forEach((btn) => {
    btn.addEventListener("click", async (e) => {
      e.stopPropagation();
      const contributionId = btn.closest(".contrib-item").dataset.contributionId;
      const res = await apiFetch(`/api/guides/contributions/${contributionId}`, { method: "DELETE" });
      if (res.ok) openSeries(seriesId);
    });
  });
}

/* ---------------- Search ---------------- */

const searchInput = document.getElementById("search");
const searchResults = document.getElementById("search-results");
let searchTimer = null;

searchInput.addEventListener("input", () => {
  clearTimeout(searchTimer);
  const q = searchInput.value.trim();
  if (!q) {
    searchResults.classList.remove("open");
    return;
  }
  searchTimer = setTimeout(async () => {
    const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
    const data = await res.json();
    const hits = [
      ...data.series.map((s) => ({ kind: "series", id: s.id, label: s.name, sub: s.brand_line })),
      ...data.figures.map((f) => ({ kind: "figure", id: f.id, label: f.name, sub: "figure" })),
      ...data.posts.map((p) => ({
        kind: "post",
        id: p.figure_id,
        label: p.title,
        sub: `post on ${p.figure_name}${p.poster ? " by @" + p.poster : ""}`,
      })),
      ...data.reviews.map((r) => ({
        kind: "review",
        id: r.figure_id,
        label: `${r.rating}★ review of ${r.figure_name}`,
        sub: r.text,
      })),
      ...data.guide_contributions.map((g) => ({
        kind: "guide",
        id: g.series_id,
        label: `${g.technique_type} tell for ${g.figure_name}`,
        sub: g.claim_text,
      })),
    ];
    if (!hits.length) {
      searchResults.innerHTML = `<div class="search-hit">No matches for "${q}"</div>`;
    } else {
      searchResults.innerHTML = hits
        .map((h) => `<div class="search-hit" data-kind="${h.kind}" data-id="${h.id}">${h.label}<small>${h.sub}</small></div>`)
        .join("");
    }
    searchResults.classList.add("open");
  }, 200);
});

searchResults.addEventListener("click", (e) => {
  const hit = e.target.closest(".search-hit");
  if (!hit || !hit.dataset.id) return;
  searchResults.classList.remove("open");
  searchInput.value = "";
  if (hit.dataset.kind === "series" || hit.dataset.kind === "guide") openSeries(hit.dataset.id);
  else openFigure(hit.dataset.id);
});

document.addEventListener("click", (e) => {
  if (!e.target.closest("#search") && !e.target.closest("#search-results")) {
    searchResults.classList.remove("open");
  }
});

/* ---------------- Init ---------------- */
renderTabs();
renderAuthArea();
loadFeed();
</script>
