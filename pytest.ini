[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto

markers =
    integration: end-to-end integration tests (require API keys)
    slow: slow-running tests

# =============================================================================
# Running Tests
# =============================================================================
#
# Run all tests:
#   pytest
#
# Run with verbose output:
#   pytest -v
#
# Run specific test file:
#   pytest tests/backend/test_example.py
#
# =============================================================================
